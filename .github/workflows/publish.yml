name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify the tag points at main's current HEAD
        # A tag matching v* is enough to trigger this workflow regardless of
        # which commit it points to — checking out that ref alone doesn't
        # prove it's part of main's reviewed history. An earlier revision of
        # this check only required the tagged commit to be SOME ancestor of
        # main, not main's actual current HEAD — this repo's own history
        # makes that gap concrete: package.json's version has stayed 0.2.1
        # across every commit so far, so tagging any older commit as v0.2.1
        # would pass an ancestor-only check AND the version check below,
        # publishing stale, unpatched code under the version string of the
        # actual, fully-fixed release. Requiring an EXACT match to main's
        # current tip closes that: it also means an account with push (tag)
        # access but no merge access to main can't publish an arbitrary,
        # unreviewed commit — one that could also modify prepack/test and
        # touch NPM_TOKEN during npm publish.
        run: |
          git fetch origin main
          main_head="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_head" ]; then
            echo "::error::tagged commit $GITHUB_SHA is not origin/main's current HEAD ($main_head) — refusing to publish a stale or unreviewed commit"
            exit 1
          fi
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg — refusing to publish a mismatched, immutable npm release"
            exit 1
          fi
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish to npm

# Triggered by pushes landing on main — NOT by an arbitrary `v*` tag push (an
# earlier design). GitHub Actions runs a workflow using the file content AT
# THE REF THAT TRIGGERED THE EVENT: for a tag push, that's whatever
# publish.yml exists at the TAGGED COMMIT, not main's reviewed copy. A
# contributor who can push a tag (but not merge to main) could therefore tag
# a side commit carrying a modified copy of this very file — e.g. with any
# safety check deleted — and it would still run with this repo's NPM_TOKEN
# and id-token:write. `push: branches: [main]` closes this because the
# workflow definition that executes is always whatever landed on main
# itself, which (assuming main is protected and requires review to push to)
# is the actual trust boundary — there's no ref an attacker can point at
# that runs a different copy of this file.
#
# Whether to publish is decided by querying the npm registry (`npm view
# <pkg>@<version>`), NOT by checking for a local git tag (a still-earlier
# revision did: `git rev-parse --verify refs/tags/vX`). A leftover/stray tag
# — created early, by hand, by another tool, or by a previous run whose
# publish step failed AFTER tagging — would make that version's release
# silently skipped forever with no error. Conversely, if `npm publish`
# succeeds but the tag-push step then fails (network blip, permissions), a
# tag-based check would see no tag on the next run, judge the version
# unpublished, and retry `npm publish` for an already-published, immutable
# version — a hard failure on every subsequent push until someone manually
# intervenes. npm itself is the actual thing being asked about, so it's
# queried directly; tagging below is a separate, idempotent, best-effort
# record that runs unconditionally afterward and tolerates having already
# been done by an earlier run.
on:
  push:
    branches: [main]

# Serializes runs of this workflow so two pushes to main close together
# can't both observe "not yet published" for the same version and race each
# other into `npm publish` (npm rejects the loser with a hard error, since
# versions are immutable). `cancel-in-progress: false` alone is NOT enough
# here: GitHub allows at most one QUEUED (pending) run per concurrency group
# regardless of that setting — a third push arriving while one run is
# in-progress and a second is already queued CANCELS the queued one and
# takes its place, so an intermediate version could be silently dropped and
# never published. `queue: max` changes this to a real FIFO queue (up to
# 100 runs) instead of a single evictable slot — confirmed against GitHub's
# own docs on `concurrency`, which describe exactly this "queued run gets
# evicted by a newer one" behavior as the default and `queue: max` as the
# fix. (`queue: max` cannot be combined with `cancel-in-progress: true` —
# not a concern here since this workflow deliberately never cancels.)
#
# `queue: max` does NOT guarantee runs execute in push order, though — per
# GitHub's own docs, FIFO here is ordered by when each run started WAITING
# on the group, not by dispatch/push time, and actual start time can vary.
# So a run for a newer version can finish publishing before an
# already-queued run for an older version gets to its own `npm publish` —
# see the "decide the npm dist-tag" step below for why that alone would
# otherwise roll the package's `latest` dist-tag backward.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Mirrors ci.yml's matrix — duplicated here rather than referenced via
  # `workflow_run` so `publish` can gate on it with a plain `needs:` tied to
  # the exact commit that triggered THIS run. ci.yml is a separate workflow
  # with no dependency relationship to this one; both fire independently on
  # the same `push: branches: [main]` event, so without this, `publish`
  # could reach `npm publish` while ci.yml's broader matrix is still running
  # — or has already failed — on the very same commit. The `publish` job
  # below only tests ubuntu-latest + Node 22 itself (needed regardless, to
  # actually build and ship dist/); ci.yml's own comment on why Windows is
  # tested (scripts/smoke-types.mjs has Windows-specific code that
  # ubuntu-latest alone never exercises) applies just as much to what's
  # about to be published here. `workflow_run` was considered and rejected:
  # it always evaluates the workflow file from the default branch regardless
  # of which SHA triggered it, and requires manually cross-checking
  # `head_sha` — more moving parts than duplicating a 6-job matrix is worth,
  # given how infrequently this workflow actually runs.
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  publish:
    needs: test-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag after a successful publish
      id-token: write # npm --provenance attestation
      # Confirmed by a real run: GitHub rejects a GITHUB_TOKEN git-push of ANY
      # ref (including a lightweight tag pointing at an already-merged commit
      # already on main) whose tree contains `.github/workflows/*`, unless the
      # token also has this permission — `contents: write` alone isn't enough,
      # even though nothing about this workflow's own content is being
      # created or changed by tagging. (If this alone turns out insufficient
      # in practice, the documented fallback is a PAT with the `workflow`
      # scope in place of GITHUB_TOKEN for this step specifically.)
      workflows: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Unconditional and this early specifically so `semver` (a
      # devDependency) is on disk before the very first step that needs it
      # — version validation, right below.
      - run: npm ci
      - id: version
        name: Read and validate package.json's version
        # Validated as CANONICAL semver (semver.valid(v) === v, not just
        # "parses") before it's used ANYWHERE else in this workflow — as an
        # `npm view hiapi_ai@$version` selector, a semver comparison, an
        # `npm publish` argument, or a git tag suffix. A non-canonical or
        # npm-dist-tag-shaped value (e.g. a stray "latest", a "v"-prefixed
        # version, a range) reaching those unvalidated could get
        # misinterpreted by npm as a SELECTOR rather than a literal version
        # — confirmed by reproduction that `npm view hiapi_ai@latest` resolves
        # via the dist-tag, not a literal string match, which would make the
        # `published` check below wrongly report an unrelated version as
        # "already published" and silently skip the real release.
        run: |
          canonical="$(node -e '
            const semver = require("semver");
            const raw = require("./package.json").version;
            const c = semver.valid(raw);
            if (c === null || c !== raw) {
              console.error(`package.json version "${raw}" is not canonical semver (semver.valid gives ${JSON.stringify(c)})`);
              process.exit(1);
            }
            process.stdout.write(c);
          ')"
          echo "version=$canonical" >> "$GITHUB_OUTPUT"
      - id: published
        name: Check the npm registry for this version (authoritative — not local git tags)
        # Only a CONFIRMED 404 (the version genuinely doesn't exist on npm,
        # identified by npm's own "code E404" marker — verified against a
        # real nonexistent-version query) is treated as "not published."
        # Any other failure (DNS, timeout, TLS, rate limiting, a registry
        # 5xx, auth) is a failure to determine the answer, not evidence the
        # version is missing — treating it as "not published" would let the
        # workflow attempt to publish an already-released, immutable version
        # (or worse, mask a real infra problem). Retried a few times for
        # exactly those inconclusive failures, then fails closed loudly
        # (with the real npm output) rather than guessing.
        run: |
          version="${{ steps.version.outputs.version }}"
          attempt=1
          max_attempts=3
          while true; do
            set +e
            output="$(npm view "hiapi_ai@$version" version 2>&1)"
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "hiapi_ai@$version is already on npm — skipping publish"
              echo "value=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if printf '%s' "$output" | grep -q "code E404"; then
              echo "hiapi_ai@$version is not on npm yet"
              echo "value=false" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "$output"
              echo "::error::npm view failed for a non-404 reason after $max_attempts attempts — refusing to guess whether hiapi_ai@$version is published"
              exit 1
            fi
            echo "npm view attempt $attempt failed for a non-404 reason, retrying in 5s: $output"
            attempt=$((attempt + 1))
            sleep 5
          done
      - if: steps.published.outputs.value == 'false'
        run: npm test
      - id: publish-tag
        if: steps.published.outputs.value == 'false'
        name: Decide the npm dist-tag for this publish
        # `npm publish` with no --tag sets `latest` to whatever was just
        # published, unconditionally — it does NOT compare semver. Combined
        # with `queue: max` not guaranteeing push order (see the
        # `concurrency` comment above), a run for an OLDER version reaching
        # this step after a NEWER version already published would roll
        # `latest` backward with no error, a user-visible regression for
        # anyone running `npm install hiapi_ai` right after. Checked here,
        # immediately before publishing (not earlier, to keep the window
        # this can still race in as small as possible): only tag this
        # publish `latest` if it's actually newer than whatever's `latest`
        # on the registry right now; otherwise publish under a distinct tag
        # so `latest` is left alone.
        #
        # Two things this step is deliberately careful about, both found by
        # reviewing an earlier version of this exact step:
        #  - The `npm view hiapi_ai@latest` lookup reuses the same "only a
        #    confirmed E404 means it doesn't exist" retry discipline as the
        #    `published` step above. Silently treating a TRANSIENT lookup
        #    failure (DNS, timeout, rate limiting, a registry 5xx) the same
        #    as "no latest tag exists yet" would restore the exact bug this
        #    step exists to prevent — publishing as `latest` while genuinely
        #    unable to tell whether a newer version is already there.
        #  - The comparison uses the real `semver` package's `.gt()`
        #    PRECEDENCE comparison (a devDependency, installed by the
        #    `npm ci` step above — irrelevant to the published SDK's own
        #    zero-dependency runtime, which only that `files` allowlist
        #    ships), not a hand-rolled `.split(".")` parser (mishandles any
        #    prerelease version — e.g. `1.1.0-beta.1` splits to a NaN
        #    component) and NOT the `semver` CLI's `-r <range>` matching
        #    either — confirmed by direct reproduction that range matching
        #    is NOT the same question: node-semver's range semantics
        #    deliberately EXCLUDE prerelease versions from matching a plain
        #    range like `>1.0.0` unless the range's own comparator shares
        #    the same [major,minor,patch] tuple (this prevents dependency
        #    ranges from silently resolving to untested prereleases) — so
        #    `semver -r ">1.0.0" "1.1.0-beta.1"` reports no match even
        #    though `semver.gt("1.1.0-beta.1", "1.0.0")` is genuinely `true`
        #    by real SemVer precedence. Using range matching here would
        #    misroute an actually-newer prerelease to a non-latest tag.
        #    `.gt()` failing for any other reason (a malformed version from
        #    either side, an unexpected exception) exits nonzero and is
        #    treated as inconclusive, same as the registry lookup above —
        #    not silently folded into "not newer."
        #
        # A PRERELEASE version (e.g. `0.3.0-beta.1`) is never tagged `latest`
        # — confirmed by reproduction that `semver.gt("0.3.0-beta.1",
        # "0.2.1")` is `true` (0.3.0 > 0.2.1 on the base version alone;
        # SemVer only consults the prerelease component as a tiebreaker when
        # major.minor.patch are EQUAL), which would otherwise tag a
        # prerelease `latest` the moment its base version outnumbers the
        # current stable release — making a plain `npm install hiapi_ai`
        # default to an untested beta. SemVer precedence answers "which is
        # numerically greater," not "which should ship to everyone by
        # default"; npm's own dist-tag docs say `latest` is for the current
        # stable release specifically. `next` — npm's conventional tag for
        # exactly this — is used instead.
        #
        # `next` gets the SAME out-of-order protection `latest` does, not a
        # blind unconditional publish: an earlier version of this step set
        # `tag=next` for every prerelease with no check at all, which just
        # relocated the exact race this whole step exists to prevent — with
        # `queue: max` not guaranteeing push order (see the `concurrency`
        # comment above), a run for `0.4.0-beta.1` executing AFTER a run for
        # `0.4.0-beta.2` would silently roll `hiapi_ai@next` backward the same
        # way an unguarded `latest` could. `decide_tag()` below is shared by
        # both paths for exactly that reason — a stable release and a
        # prerelease differ only in WHICH shared tag (`latest` vs `next`)
        # they're checked and published against, not in whether the check
        # happens.
        run: |
          version="${{ steps.version.outputs.version }}"

          # Decides whether $1 (a shared, mutable dist-tag — "latest" or
          # "next") is safe to use for this publish, or whether to fall back
          # to a version-specific tag that leaves it alone. Prints the
          # winning tag on stdout; every other message goes to stderr so it
          # doesn't get captured into that value by the caller's `$(...)`.
          decide_tag() {
            local shared_tag="$1"
            local current attempt=1 max_attempts=3 output exit_code
            while true; do
              set +e
              output="$(npm view "hiapi_ai@$shared_tag" version 2>&1)"
              exit_code=$?
              set -e
              if [ "$exit_code" -eq 0 ]; then
                current="$output"
                break
              fi
              if printf '%s' "$output" | grep -q "code E404"; then
                current="" # this dist-tag doesn't exist yet.
                break
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$output" >&2
                echo "::error::npm view hiapi_ai@$shared_tag failed for a non-404 reason after $max_attempts attempts — refusing to guess this publish's dist-tag" >&2
                exit 1
              fi
              echo "npm view hiapi_ai@$shared_tag attempt $attempt failed for a non-404 reason, retrying in 5s: $output" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ -z "$current" ]; then
              echo "$shared_tag"
              return
            fi
            local is_newer node_exit
            set +e
            is_newer="$(node -e '
              const semver = require("semver");
              const [version, current] = process.argv.slice(1);
              if (!semver.valid(version)) {
                console.error(`the version being published (${version}) is not valid semver`);
                process.exit(2);
              }
              if (!semver.valid(current)) {
                console.error(`the current dist-tag value (${current}) is not valid semver`);
                process.exit(2);
              }
              process.stdout.write(semver.gt(version, current) ? "true" : "false");
            ' "$version" "$current")"
            node_exit=$?
            set -e
            if [ "$node_exit" -ne 0 ]; then
              echo "::error::could not compare hiapi_ai@$version against the current hiapi_ai@$shared_tag ($current) via semver — refusing to guess the dist-tag" >&2
              exit 1
            fi
            if [ "$is_newer" = "true" ]; then
              echo "$shared_tag"
            else
              echo "::warning::hiapi_ai@$version is not newer than the current hiapi_ai@$shared_tag ($current) — an out-of-order concurrent run must have published a newer version to that tag first. Publishing under a version-specific dist-tag so hiapi_ai@$shared_tag isn't rolled back." >&2
              echo "superseded-$version"
            fi
          }

          if node -e 'process.exit(require("semver").prerelease(process.argv[1]) ? 0 : 1)' "$version"; then
            tag="$(decide_tag next)"
          else
            tag="$(decide_tag latest)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.value == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.publish-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Ensure the release tag exists and points at the published commit
        # The commit to tag depends on WHO published this version:
        #  - If this run just published it (value == 'false' above), the
        #    current checkout — github.sha — IS that commit; no need to ask
        #    npm to confirm what we just did ourselves.
        #  - If it was already published (value == 'true'), github.sha is
        #    NOT necessarily right: this run could have been triggered by a
        #    later, unrelated commit that didn't bump the version. npm's own
        #    `gitHead` metadata (recorded at publish time — confirmed
        #    present on real published packages) is the actual record of
        #    which commit that release came from.
        # Either way, an EXISTING tag is verified to point at the same
        # commit rather than trusted on sight — silently accepting a
        # mismatched/stray tag would let `vX.Y.Z` on GitHub point at
        # different source than what npm actually shipped.
        run: |
          v="v${{ steps.version.outputs.version }}"
          if [ "${{ steps.published.outputs.value }}" = "false" ]; then
            target_sha="${{ github.sha }}"
          else
            target_sha="$(npm view "hiapi_ai@${{ steps.version.outputs.version }}" gitHead 2>/dev/null || true)"
            if [ -z "$target_sha" ]; then
              echo "::error::npm has no gitHead recorded for hiapi_ai@${{ steps.version.outputs.version }} — cannot verify which commit was published; refusing to guess a tag target. Tag it manually once you've confirmed the right commit."
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$v")"
            if [ "$existing_sha" != "$target_sha" ]; then
              echo "::error::tag $v points at $existing_sha but the published commit is $target_sha — refusing to silently accept a mismatched tag. Investigate and fix it manually."
              exit 1
            fi
            echo "$v already exists and matches the published commit"
          else
            git tag "$v" "$target_sha"
            git push origin "$v"
          fi

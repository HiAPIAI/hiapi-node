name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is not just an extra target: scripts/smoke-types.mjs has
    # Windows-specific code (resolving npm's own CLI relative to the node
    # install layout, with a cmd.exe fallback) that ubuntu-latest alone can
    # never actually exercise — a real bug there could pass every check here
    # and still fail for a Windows user.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
